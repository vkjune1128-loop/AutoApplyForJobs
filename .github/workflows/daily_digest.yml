name: Daily AutoApply Jobs Digest

on:
  schedule:
    # 5:30 AM IST (00:00 UTC) and 2:30 PM IST (09:00 UTC) every day
    - cron: '0 0 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  morning-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies for WeasyPrint (PDF engine)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libpangocairo-1.0-0

      - name: Install AutoApply package
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium (guest scraper)
        run: |
          playwright install chromium

      - name: Run Morning Discovery & Resume Tailoring
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m autoapply.cli morning-run --min-score 70 --max-jobs 10

      - name: Commit and push daily digest & tailored resumes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AutoApply Bot"
          git add data/ DAILY_DIGEST.md
          if git diff --staged --quiet; then
            echo "No new jobs discovered today. Nothing to commit."
          else
            git commit -m "chore(morning-digest): $(date -u +'%Y-%m-%d') daily job digest & resumes"
            git push origin main
          fi

      - name: Check digest and notify mobile via GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('DAILY_DIGEST.md')) return;
            const digestContent = fs.readFileSync('DAILY_DIGEST.md', 'utf8');
            if (digestContent.includes('All caught up!') || !digestContent.includes('|:---|:---|')) {
              console.log('Action queue is all caught up. No notification needed.');
              return;
            }
            const username = 'vkjune1128-loop';
            const todayStr = new Date().toISOString().slice(0, 10);
            const issueTitle = `🌅 Daily Action Queue — ${todayStr} (Fresh Roles Ready)`;
            const issueBody = `Hey @${username}! 🌅 **Your daily tailored jobs are ready.**\n\n` +
              `Tap **[🚀 Apply Now]** on the roles below, upload your tailored PDFs, and tap **Close Issue** when you're done!\n\n` +
              `> 💡 *Closing this issue automatically syncs your applications into the SQLite database on your Mac!*\n\n` +
              `---\n\n` +
              digestContent;

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daily-digest'
            });

            if (openIssues.data.length > 0) {
              const existingNum = openIssues.data[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingNum,
                title: issueTitle,
                body: issueBody
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingNum,
                body: `🔔 Hey @${username}! Your Daily Action Queue has been refreshed with newly tailored roles. Check the issue description above to apply!`
              });
              console.log(`Updated Issue #${existingNum} and notified mobile`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['daily-digest', 'ready-to-apply']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: newIssue.data.number,
                body: `🔔 Hey @${username}! Your Daily Action Queue is ready with fresh roles. Check the issue description above to apply!`
              });
              console.log(`Created Issue #${newIssue.data.number} and notified mobile`);
            }
